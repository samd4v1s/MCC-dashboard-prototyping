<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gorton on a page</title>
    <!-- 1. Load the updated stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/style.css" />
  </head>
  <body>
    <!-- 2. Create a container for the app -->
    <div id="root"></div>

    <!-- 3. Load stlite as an ES Module -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.js";

      fetch("app.py")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load app.py (HTTP ${response.status})`);
          }
          return response.text();
        })
        .then((appSource) => mount(
          {
            requirements: ["pandas", "plotly"],
            entrypoint: "app.py",
            files: { "app.py": appSource }
          },
          document.getElementById("root")
        ))
        .catch((error) => {
          document.getElementById("root").textContent = `Dashboard failed to load: ${error.message}`;
          console.error(error);
        });
    </script>
  </body>
</html>
